id: ssrf-php
language: php
severity: warning
message: 'SSRF服务器端请求伪造（PHP） (CWE-918)'
name: SSRF服务器端请求伪造（PHP）
description: PHP 中 file_get_contents/cURL 常用于远程请求，若URL来源不可信会导致SSRF。
cwe: CWE-918
remediation: |
  避免直接请求用户给出的URL，优先通过固定后端服务转发并做白名单控制。
  ```php
  <?php
  // 不安全的代码 ❌
  $data = file_get_contents($userUrl);
  // 安全的代码 ✅
  $parts = parse_url($userUrl);
  if ($parts !== false &&
      ($parts['scheme'] ?? '') === 'https' &&
      ($parts['host'] ?? '') === 'api.example.com') {
      $data = file_get_contents($userUrl);
  }
  ?>
  ```
rule:
  kind: function_call_expression
  any:
    - pattern: file_get_contents($USER_URL)
    - pattern: fopen($USER_URL, "r")
    - pattern: curl_setopt($CH, CURLOPT_URL, $USER_URL)
    - pattern: curl_exec($CH)
    - pattern: file_get_contents("http://localhost$$$REST")
    - pattern: file_get_contents("http://127.0.0.1$$$REST")
    - pattern: file_get_contents("http://169.254.169.254$$$REST")
    - all:
        - pattern: file_get_contents($URL)
        - regex: 'file_get_contents\("https?://(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[0-1])\.)'

    # false-negative coverage expansion - additional HTTP client sinks
    - pattern: '$CLIENT->request($METHOD, $USER_URL)'
    - pattern: '$CLIENT->get($USER_URL)'
    - pattern: '$CLIENT->post($USER_URL, $$$ARGS)'
    - pattern: 'HttpClient::create()->request($METHOD, $USER_URL)'
    - pattern: 'HttpClient::create()->get($USER_URL)'
    - pattern: 'HttpClient::create()->post($USER_URL, $$$ARGS)'

    # ===== Guzzle sinks =====
    - pattern: '$CLIENT = new GuzzleHttp\Client()'
    - pattern: '$CLIENT->request($METHOD, $USER_URL)'
    - pattern: '$CLIENT->get($USER_URL)'
    - pattern: '$CLIENT->post($USER_URL, $$$ARGS)'
    - pattern: '$CLIENT->put($USER_URL, $$$ARGS)'
    - pattern: '$CLIENT->delete($USER_URL)'

    # ===== WordPress HTTP API sinks =====
    - pattern: 'wp_remote_get($USER_URL)'
    - pattern: 'wp_remote_post($USER_URL, $$$ARGS)'
    - pattern: 'wp_remote_request($USER_URL, $$$ARGS)'
    - pattern: 'wp_safe_remote_get($USER_URL)'
    - pattern: 'wp_safe_remote_post($USER_URL, $$$ARGS)'

    # ===== CakePHP Http Client sinks =====
    - pattern: '$CLIENT = new Cake\Http\Client()'
    - pattern: '$CLIENT->get($USER_URL)'
    - pattern: '$CLIENT->post($USER_URL, $$$ARGS)'
    - pattern: '$CLIENT->put($USER_URL, $$$ARGS)'
    - pattern: '$CLIENT->delete($USER_URL)'

    # ===== 云元数据地址检测 =====
    - pattern: file_get_contents("http://metadata.google.internal$$$REST")
    - pattern: file_get_contents("http://100.100.100.200$$$REST")
    - all:
        - kind: function_call_expression
          pattern: '$METHOD($URL)'
        - regex: '(?i)(file_get_contents|curl_exec|fopen|request|get|post)'
        - regex: '(?i)("https?://(metadata\.google\.internal|100\.100\.100\.200))'
