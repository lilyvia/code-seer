id: auth-defects-go
language: go
severity: warning
message: '鉴权缺陷（Go） (CWE-287)'
name: 鉴权缺陷（Go）
description: Go Web 服务常通过路由和中间件控制访问权限。
cwe: CWE-287
remediation: |
  对路由与处理函数同时加强鉴权：
  ```go
  // Gin 路由示例
  admin := r.Group("/admin")
  admin.Use(AuthMiddleware(), RequireRole("admin"))
  admin.DELETE("/users/:id", deleteUser)
  func getOrder(c *gin.Context) {
      orderID := c.Param("id")
      order := repo.GetOrderByID(orderID)
      uid := c.GetString("user_id")
      if order.UserID != uid {
          c.AbortWithStatus(http.StatusForbidden)
          return
      }
      c.JSON(http.StatusOK, order)
  }
  ```
  建议：
  - 敏感路由必须绑定认证+角色中间件
  - 所有按ID读取的业务都校验资源归属
  - 关键操作在Service层进行二次权限校验
rule:
  any:
    - kind: short_var_declaration
      pattern: '$VAR, $ERR := $REPO.$METHOD($REQ.URL.Query().Get($KEY))'
    - kind: short_var_declaration
      pattern: '$VAR, $ERR := $DB.$METHOD($CTX.Param($KEY))'
    - kind: if_statement
      pattern: 'if $USERID != "" { $REPO.DeleteUser($TARGET) }'
    - kind: call_expression
      pattern: '$DB.First($$$, $CTX.Query($KEY))'
    - kind: call_expression
      pattern: '$DB.Where($$$, $CTX.Param($KEY)).$METHOD($$$)'
    - kind: call_expression
      pattern: '$CTX.JSON($CODE, $DB.Find($CTX.Param($KEY)))'

    # ===== Gin 框架鉴权缺失 =====
    - kind: call_expression
      pattern: '$ROUTER.Group($PATH)'
      regex: '(?i)"/admin"'
      not:
        regex: 'AuthMiddleware|RequireRole|RequireAuth'
    - kind: call_expression
      pattern: '$ROUTER.GET($PATH, $HANDLER)'
      regex: '(?i)("/admin"|"/manage"|"/api/users"|"/api/orders")'
    - kind: call_expression
      pattern: '$ROUTER.DELETE($PATH, $HANDLER)'
      regex: '(?i)("/admin"|"/manage"|"/api/users"|"/api/orders")'
    - kind: call_expression
      pattern: '$ROUTER.PUT($PATH, $HANDLER)'
      regex: '(?i)("/admin"|"/manage"|"/api/users"|"/api/orders")'
    - kind: call_expression
      pattern: '$ROUTER.POST($PATH, $HANDLER)'
      regex: '(?i)("/admin"|"/manage"|"/api/users"|"/api/orders")'

    # ===== Echo 框架鉴权缺失 =====
    - kind: call_expression
      pattern: '$ECHO.GET($PATH, $HANDLER)'
      regex: '(?i)("/admin"|"/manage"|"/api/users"|"/api/orders")'
    - kind: call_expression
      pattern: '$ECHO.DELETE($PATH, $HANDLER)'
      regex: '(?i)("/admin"|"/manage"|"/api/users"|"/api/orders")'
    - kind: call_expression
      pattern: '$ECHO.PUT($PATH, $HANDLER)'
      regex: '(?i)("/admin"|"/manage"|"/api/users"|"/api/orders")'
    - kind: call_expression
      pattern: '$ECHO.POST($PATH, $HANDLER)'
      regex: '(?i)("/admin"|"/manage"|"/api/users"|"/api/orders")'

    # ===== Fiber 框架鉴权缺失 =====
    - kind: call_expression
      pattern: '$APP.Get($PATH, $HANDLER)'
      regex: '(?i)("/admin"|"/manage"|"/api/users"|"/api/orders")'
      not:
        regex: '(?i)(secure|auth|safe)'
    - kind: call_expression
      pattern: '$APP.Delete($PATH, $HANDLER)'
      regex: '(?i)("/admin"|"/manage"|"/api/users"|"/api/orders")'
      not:
        regex: '(?i)(secure|auth|safe)'
    - kind: call_expression
      pattern: '$APP.Put($PATH, $HANDLER)'
      regex: '(?i)("/admin"|"/manage"|"/api/users"|"/api/orders")'
      not:
        regex: '(?i)(secure|auth|safe)'
    - kind: call_expression
      pattern: '$APP.Post($PATH, $HANDLER)'
      regex: '(?i)("/admin"|"/manage"|"/api/users"|"/api/orders")'
      not:
        regex: '(?i)(secure|auth|safe)'

