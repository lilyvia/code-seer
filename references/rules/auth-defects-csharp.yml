id: auth-defects-csharp
language: csharp
severity: warning
message: '鉴权缺陷（C#） (CWE-287)'
name: 鉴权缺陷（C#）
description: |
  ASP.NET 鉴权缺陷常发生在缺少身份验证或授权校验的 API 端点，
  或 WebForms 的 PerformAction / switch-case 事务处理链中。
cwe: CWE-287
remediation: |
  对敏感控制器和动作方法增加认证与授权策略：
  ```csharp
  [ApiController]
  [Route("admin")]
  public class AdminController : ControllerBase
  {
      [Authorize(Roles = "Admin")]
      [HttpDelete("users/{id}")]
      public IActionResult DeleteUser(int id)
      {
          _service.DeleteUser(id);
          return NoContent();
      }
  }
  [Authorize]
  [HttpGet("orders/{id}")]
  public IActionResult GetOrder(int id)
  {
      var order = _context.Orders.Find(id);
      if (order == null || order.UserId != User.Identity!.Name) {
          return Forbid();
      }
      return Ok(order);
  }
  ```
  WebForms 事务处理建议：
  - 在 switch-case / if 事务分支中执行敏感操作前调用权限检查方法
  - 敏感操作包括：数据库修改、文件操作、网络请求、系统配置变更
  - 权限检查方法如：InstCheckXSettings、IsSysAdmin、CheckPermission 等
rule:
  any:
    - pattern: return Ok($CTX.$TABLE.Find($ID));
    - pattern: return Ok(await $CTX.$TABLE.FindAsync($ID));
    - pattern: return Ok($CTX.$TABLE.FirstOrDefault($$$));
    - pattern: return Ok(await $CTX.$TABLE.FirstOrDefaultAsync($$$));
    - kind: expression_statement
      pattern: $CTX.$TABLE.Remove($ENTITY);
      inside:
        kind: block
        inside:
          kind: if_statement
          regex: IsAuthenticated

    - kind: if_statement
      has:
        kind: binary_expression
        has:
          kind: invocation_expression
          pattern: 'Operators.CompareString(transaction, $$$)'

    # false-negative coverage expansion
    - kind: attribute
      regex: 'AllowAnonymous'
    - kind: class_declaration
      regex: 'class\s+\w*(Admin|Manage|Api)\w*\s*:\s*Controller'
